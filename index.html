<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de ingreso — Monkey D Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', Arial, sans-serif;
    background: #efe9df; color: #2b2420; min-height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .phone {
    max-width: 520px; width: 100%; min-height: 100vh;

  }
  .hero {
    padding: 30px 26px 20px;

  .hero-eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.75; margin: 0 0 6px; }
  .hero-title { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 600; margin: 0; line-height: 1.15; }
  .hero-sub { font-size: 13px; opacity: 0.85; margin-top: 8px; line-height: 1.5; }

  .content { padding: 26px 26px 50px; }
  .section-label {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: #e07a1f; font-weight: 600; margin: 26px 0 12px;
  }
  .section-label:first-child { margin-top: 0; }
  label { display: block; font-size: 12px; color: #8a7a68; margin: 12px 0 5px; font-weight: 500; }
  input, select {
    width: 100%; padding: 11px 12px; border: 1px solid #e3dbcb; border-radius: 8px;
    background: #fff; font-size: 14px; color: #2b2420; font-family: inherit;
  }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row-tel { display: grid; grid-template-columns: 90px 1fr; gap: 8px; }
  .field-err { font-size: 11px; color: #c0392b; margin-top: 3px; min-height: 14px; }
  #btn {
    width: 100%; margin-top: 28px; padding: 15px; border: none; border-radius: 10px;

  .msg.err { color: #c0392b; }
  .success2 { text-align: center; padding: 50px 26px; }
  .icon2 { width: 56px; height: 56px; border-radius: 50%; background: #e07a1f; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 18px; }
  .success2 h2 { font-family: 'Playfair Display', serif; font-size: 22px; margin: 0 0 6px; color: #1D252C; }
  .sub2 { color: #8a7a68; font-size: 13.5px; margin: 0; }
</style>
</head>
<body>
<div class="phone" id="card">
  <div class="hero">

      <div class="row2">

      <div class="row2">

<script>
const NEGOCIO = 'monkey';

function formatearRut(valor) {
  let limpio = valor.replace(/[^0-9kK]/g, '').toUpperCase();
  if (limpio.length === 0) return '';
  let dv = limpio.slice(-1);
  let cuerpo = limpio.slice(0, -1);
  if (cuerpo.length === 0) return dv;
  let cuerpoFormateado = '';
  for (let i = 0; i < cuerpo.length; i++) {
    const posDesdeElFinal = cuerpo.length - i;
    cuerpoFormateado += cuerpo[i];
    if (posDesdeElFinal > 1 && posDesdeElFinal % 3 === 1) cuerpoFormateado += '.';
  }
  return cuerpoFormateado + '-' + dv;
}
function rutValido(valor) {
  const limpio = valor.replace(/[^0-9kK]/g, '').toUpperCase();
  if (limpio.length < 2) return false;
  const dv = limpio.slice(-1);
  const cuerpo = limpio.slice(0, -1);
  if (!/^\d+$/.test(cuerpo)) return false;
  let suma = 0, multiplo = 2;
  for (let i = cuerpo.length - 1; i >= 0; i--) {
    suma += parseInt(cuerpo[i], 10) * multiplo;
    multiplo = multiplo === 7 ? 2 : multiplo + 1;
  }
  const resto = 11 - (suma % 11);
  let dvEsperado = resto === 11 ? '0' : resto === 10 ? 'K' : String(resto);
  return dv === dvEsperado;
}
function correoValido(valor) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(valor.trim());
}

const rutInput = document.getElementById('rut');
rutInput.addEventListener('input', function() {
  const cursorAlFinal = this.selectionStart === this.value.length;
  this.value = formatearRut(this.value);
  if (cursorAlFinal) this.setSelectionRange(this.value.length, this.value.length);
});
rutInput.addEventListener('blur', function() {
  document.getElementById('errRut').textContent = (this.value && !rutValido(this.value)) ? 'RUT inválido, revisa el dígito verificador' : '';
});

const telInput = document.getElementById('telefono');
telInput.addEventListener('input', function() { this.value = this.value.replace(/[^0-9]/g, ''); });
telInput.addEventListener('blur', function() {
  document.getElementById('errTelefono').textContent = (this.value && this.value.length < 8) ? 'Teléfono incompleto' : '';
});

document.getElementById('email').addEventListener('blur', function() {
  document.getElementById('errCorreo').textContent = (this.value && !correoValido(this.value)) ? 'Ingresa un correo válido' : '';
});

document.getElementById('salud').addEventListener('change', function() {
  document.getElementById('wrapPlanUF').style.display = this.value === 'isapre' ? 'block' : 'none';
});

document.getElementById('domicilioComuna').addEventListener('change', function() {
  document.getElementById('domicilioComunaOtra').style.display = this.value === 'otra' ? 'block' : 'none';
});
document.getElementById('domicilioCiudad').addEventListener('change', function() {
  document.getElementById('domicilioCiudadOtra').style.display = this.value === 'otra' ? 'block' : 'none';
});
const REGIONES_COMUNAS = {

  "Región de Antofagasta": { "Antofagasta": ["Antofagasta","Mejillones","Sierra Gorda","Taltal"], "Calama": ["Calama","Ollagüe","San Pedro de Atacama"], "Tocopilla": ["Tocopilla","María Elena"] },
  "Región de Arica y Parinacota": { "Arica": ["Arica","Camarones"], "Putre": ["Putre","General Lagos"] },
  "Región de Atacama": { "Copiapó": ["Copiapó","Caldera","Tierra Amarilla"], "Vallenar": ["Vallenar","Alto del Carmen","Freirina","Huasco"], "Chañaral": ["Chañaral","Diego de Almagro"] },
  "Región de Coquimbo": { "La Serena": ["La Serena","Coquimbo","Andacollo","La Higuera","Paiguano","Vicuña"], "Ovalle": ["Ovalle","Combarbalá","Monte Patria","Punitaqui","Río Hurtado"], "Illapel": ["Illapel","Canela","Los Vilos","Salamanca"] },
  "Región de La Araucanía": { "Temuco": ["Temuco","Cholchol","Cunco","Curarrehue","Freire","Galvarino","Gorbea","Lautaro","Loncoche","Melipeuco","Nueva Imperial","Padre Las Casas","Perquenco","Pitrufquén","Pucón","Saavedra","Teodoro Schmidt","Toltén","Vilcún","Villarrica"], "Angol": ["Angol","Collipulli","Curacautín","Ercilla","Lonquimay","Los Sauces","Lumaco","Purén","Renaico","Traiguén","Victoria"] },
  "Región de Los Lagos": { "Puerto Montt": ["Puerto Montt","Calbuco","Cochamó","Fresia","Frutillar","Llanquihue","Los Muermos","Maullín","Puerto Varas"], "Castro": ["Castro","Ancud","Chonchi","Curaco de Vélez","Dalcahue","Puqueldón","Queilén","Quellón","Quemchi"], "Osorno": ["Osorno","Puerto Octay","Purranque","Puyehue","Río Negro","San Juan de la Costa","San Pablo"], "Chaitén": ["Chaitén","Futaleufú","Hualaihué","Palena"] },
  "Región de Los Ríos": { "Valdivia": ["Valdivia","Corral","Lanco","Los Lagos","Máfil","Mariquina","Paillaco","Panguipulli"], "La Unión": ["La Unión","Futrono","Lago Ranco","Río Bueno"] },
  "Región de Magallanes y la Antártica Chilena": { "Punta Arenas": ["Punta Arenas","Laguna Blanca","Río Verde","San Gregorio"], "Puerto Natales": ["Natales","Torres del Paine"], "Porvenir": ["Porvenir","Primavera","Timaukel"], "Puerto Williams": ["Cabo de Hornos","Antártica"] },
  "Región de Tarapacá": { "Iquique": ["Iquique","Alto Hospicio"], "Pozo Almonte": ["Pozo Almonte","Camiña","Colchane","Huara","Pica"] },
  "Región de Valparaíso": { "Valparaíso": ["Valparaíso","Casablanca","Concón","Juan Fernández","Viña del Mar"], "Quillota": ["Quillota","Calera","Hijuelas","La Cruz","Nogales"], "San Antonio": ["San Antonio","Algarrobo","Cartagena","El Quisco","El Tabo","Santo Domingo"], "San Felipe": ["San Felipe","Catemu","Llaillay","Panquehue","Putaendo","Santa María"], "Los Andes": ["Los Andes","Calle Larga","Rinconada","San Esteban"], "Quilpué": ["Quilpué","Limache","Olmué","Villa Alemana"], "La Ligua": ["La Ligua","Cabildo","Papudo","Petorca","Zapallar"], "Isla de Pascua": ["Isla de Pascua"] },
  "Región de Ñuble": { "Chillán": ["Chillán","Bulnes","Chillán Viejo","El Carmen","Pemuco","Pinto","Quillón","San Ignacio","Yungay"], "San Carlos": ["San Carlos","Coihueco","Ninhue","Ñiquén","Quirihue","Ránquil","San Fabián","San Nicolás","Treguaco"] },
  "Región del Biobío": { "Concepción": ["Concepción","Chiguayante","Coronel","Florida","Hualqui","Lota","Penco","San Pedro de la Paz","Santa Juana","Talcahuano","Tomé"], "Los Ángeles": ["Los Ángeles","Antuco","Cabrero","Laja","Mulchén","Nacimiento","Negrete","Quilaco","Quilleco","San Rosendo","Santa Bárbara","Tucapel","Yumbel"], "Arauco": ["Arauco","Cañete","Contulmo","Curanilahue","Lebu","Los Álamos","Tirúa"] },
  "Región del Libertador General Bernardo O'Higgins": { "Rancagua": ["Rancagua","Codegua","Coinco","Coltauco","Doñihue","Graneros","Las Cabras","Machalí","Malloa","Mostazal","Olivar","Peumo","Pichidegua","Quinta de Tilcoco","Rengo","Requínoa","San Vicente"], "Pichilemu": ["Pichilemu","La Estrella","Litueche","Marchihue","Navidad","Paredones"], "San Fernando": ["San Fernando","Chépica","Chimbarongo","Nancagua","Palmilla","Peralillo","Placilla","Pumanque","Santa Cruz"] },
  "Región del Maule": { "Talca": ["Talca","Constitución","Curepto","Empedrado","Maule","Pelarco","Pencahue","Río Claro","San Clemente","San Rafael"], "Curicó": ["Curicó","Hualañé","Licantén","Molina","Rauco","Romeral","Sagrada Familia","Teno","Vichuquén"], "Linares": ["Linares","Colbún","Longaví","Parral","Retiro","San Javier","Villa Alegre","Yerbas Buenas"], "Cauquenes": ["Cauquenes","Chanco","Pelluhue"] },
  "Región Metropolitana de Santiago": { "Santiago": ["Santiago","Cerrillos","Cerro Navia","Conchalí","El Bosque","Estación Central","Huechuraba","Independencia","La Cisterna","La Florida","La Granja","La Pintana","La Reina","Las Condes","Lo Barnechea","Lo Espejo","Lo Prado","Macul","Maipú","Ñuñoa","Pedro Aguirre Cerda","Peñalolén","Providencia","Pudahuel","Quilicura","Quinta Normal","Recoleta","Renca","San Joaquín","San Miguel","San Ramón","Vitacura"], "Puente Alto": ["Puente Alto","Pirque","San José de Maipo"], "San Bernardo": ["San Bernardo","Calera de Tango"], "Colina": ["Colina","Lampa","Tiltil"], "Melipilla": ["Melipilla","Alhué","Curacaví","María Pinto","San Pedro"], "Talagante": ["Talagante","El Monte","Isla de Maipo","Padre Hurtado","Peñaflor"] }
};

function poblarRegiones() {
  const sel = document.getElementById('domicilioRegion');
  const regiones = Object.keys(REGIONES_COMUNAS).sort((a,b) => a.localeCompare(b, 'es'));
  sel.innerHTML = '<option value="">-- Selecciona --</option>' + regiones.map(r => `<option${r === 'Región Metropolitana de Santiago' ? ' selected' : ''}>${r}</option>`).join('');
}
function poblarCiudades(mantenerSeleccion) {
  const region = document.getElementById('domicilioRegion').value;
  const selCiudad = document.getElementById('domicilioCiudad');
  const valorPrevio = mantenerSeleccion ? selCiudad.value : null;
  if (!region || !REGIONES_COMUNAS[region]) {
    selCiudad.innerHTML = '<option value="">-- Primero selecciona región --</option>';
    poblarComunas();
    return;
  }
  const ciudades = Object.keys(REGIONES_COMUNAS[region]).sort((a,b) => a.localeCompare(b, 'es'));
  selCiudad.innerHTML = '<option value="">-- Selecciona --</option>' +
    ciudades.map(c => `<option${c === valorPrevio || (!valorPrevio && c === 'Santiago' && region === 'Región Metropolitana de Santiago') ? ' selected' : ''}>${c}</option>`).join('') +
    '<option value="otra">Otra…</option>';
  poblarComunas();
}
function poblarComunas() {
  const region = document.getElementById('domicilioRegion').value;
  const ciudad = document.getElementById('domicilioCiudad').value;
  const selComuna = document.getElementById('domicilioComuna');
  document.getElementById('domicilioCiudadOtra').style.display = ciudad === 'otra' ? 'block' : 'none';
  if (!ciudad) {
    selComuna.innerHTML = '<option value="">-- Primero selecciona ciudad --</option>';
    document.getElementById('domicilioComunaOtra').style.display = 'none';
    return;
  }
  if (ciudad === 'otra') {
    selComuna.innerHTML = '<option value="otra" selected>Otra…</option>';
    document.getElementById('domicilioComunaOtra').style.display = 'block';
    return;
  }
  const comunas = ((REGIONES_COMUNAS[region] || {})[ciudad] || []).slice().sort((a,b) => a.localeCompare(b, 'es'));
  selComuna.innerHTML = '<option value="">-- Selecciona --</option>' + comunas.map(c => `<option>${c}</option>`).join('') + '<option value="otra">Otra…</option>';
  document.getElementById('domicilioComunaOtra').style.display = 'none';
}
document.getElementById('domicilioRegion').addEventListener('change', () => poblarCiudades(false));
document.getElementById('domicilioCiudad').addEventListener('change', poblarComunas);
document.getElementById('domicilioComuna').addEventListener('change', function() {
  document.getElementById('domicilioComunaOtra').style.display = this.value === 'otra' ? 'block' : 'none';
});
poblarRegiones();
poblarCiudades(false);

function valorConOtra(idSelect, idOtra) {
  const sel = document.getElementById(idSelect).value;
  if (sel === 'otra') return document.getElementById(idOtra).value.trim();
  return sel;
}

document.getElementById('form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  msg.textContent = '';
  msg.className = 'msg';

  const rut = document.getElementById('rut').value.trim();
  const email = document.getElementById('email').value.trim();
  const telefono = document.getElementById('telefono').value.trim();

  let valido = true;
  if (!rutValido(rut)) { document.getElementById('errRut').textContent = 'RUT inválido, revisa el dígito verificador'; valido = false; }
  if (!correoValido(email)) { document.getElementById('errCorreo').textContent = 'Ingresa un correo válido'; valido = false; }
  if (telefono.length < 8) { document.getElementById('errTelefono').textContent = 'Teléfono incompleto'; valido = false; }
  if (!valido) {
    msg.textContent = 'Revisa los datos marcados en rojo.';
    msg.className = 'msg err';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const codPais = document.getElementById('codPais').value;
  const body = {
    negocio: NEGOCIO,
    nombre: document.getElementById('nombre').value.trim(),
    apellido: document.getElementById('apellido').value.trim(),
    rut: rut,
    nacionalidad: document.getElementById('nacionalidad').value.trim() || null,
    fecha_nacimiento: document.getElementById('fechaNacimiento').value || null,
    estado_civil: document.getElementById('estadoCivil').value,
    domicilio_calle: document.getElementById('domicilioCalle').value.trim(),
    domicilio_num: document.getElementById('domicilioNum').value.trim(),
    domicilio_comuna: valorConOtra('domicilioComuna', 'domicilioComunaOtra'),
    domicilio_ciudad: valorConOtra('domicilioCiudad', 'domicilioCiudadOtra') || null,
    domicilio_region: document.getElementById('domicilioRegion').value || null,
    domicilio_depto: document.getElementById('domicilioDepto').value.trim() || null,
    email: email.toLowerCase(),
    telefono: codPais.replace('+','') + telefono,
    afp: document.getElementById('afp').value || null,
    sistema_salud: document.getElementById('salud').value,
    plan_isapre_uf: document.getElementById('planUF').value ? parseFloat(document.getElementById('planUF').value) : null,
    banco: document.getElementById('banco').value.trim() || null,
    tipo_cuenta: document.getElementById('tipoCuenta').value,
    numero_cuenta: document.getElementById('numeroCuenta').value.trim() || null,
    estado: 'pendiente_contrato'
  };

  try {
    const resp = await fetch('https://mis-negocios-n8n.u7xiga.easypanel.host/webhook/nuevo-trabajador-rrhh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'error desconocido');

    document.getElementById('card').innerHTML = `
      <div class="success2">
        <div class="icon2">&#10003;</div>
        <h2>¡Ficha enviada!</h2>
        <p class="sub2">Gracias, ${body.nombre}. Recibimos tus datos correctamente.<br><br>El equipo revisará tu información y se pondrá en contacto contigo para coordinar los términos de tu contrato.</p>
      </div>`;
  } catch (err) {
    msg.textContent = err.message && err.message !== 'error desconocido'
      ? 'No se pudo enviar: ' + err.message
      : 'Hubo un problema al enviar tu ficha. Intenta de nuevo.';
    msg.className = 'msg err';
    btn.disabled = false;
    btn.textContent = 'Enviar ficha';
  }
});
</script>
</body>
</html>
